name: CI SWAL-GARA

# Compuerta real de la PWA (compila, lintea, type-checkea, tests vitest y build).
# Foundry, Rust y Flutter se validan en foundry-rust-flutter.yml, que solo se
# dispara cuando cambian sus propias carpetas.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  lint-and-quality:
    name: 🧹 Lint & Type Check (0 Warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Biome Check
        env:
          CI: 'true'
        run: pnpm lint

      - name: Type Check PWA
        # NOTE: `astro check` reporta 46 errores de tipo preexistentes en la app
        # (ver REPORT.md). El repo siempre lo trato como no-bloqueante; aqui se
        # mantiene esa semantica y ademas se imprime el resumen para que quede
        # registro visible en el log en vez de perderlo.
        env:
          CI: 'true'
        run: |
          pnpm --filter gara-g-app-pwa check || echo "::warning::astro check reporta errores de tipo preexistentes (no bloqueante, ver REPORT.md)"

  lighthouse-budget:
    name: ⚡ Lighthouse Performance Budget (>=85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Build App PWA
        env:
          CI: 'true'
        run: pnpm --filter gara-g-app-pwa build

      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadTargets: 'temporary-public-storage'
          budgetPath: '.github/lighthouse-budget.json'

  # Vitest de la PWA: la compuerta real de este repositorio.
  pwa-unit-tests:
    name: 🧪 PWA Unit Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Build PWA bundle (input del gate del bundle de deploy)
        env:
          CI: 'true'
        run: pnpm --filter gara-g-app-pwa build

      - name: Deploy bundle safety tests (contenido del bundle)
        env:
          CI: 'true'
        working-directory: packages/app-pwa
        run: pnpm exec vitest run tests/deploy-bundle-safety.test.ts

      - name: Run vitest (packages/app-pwa)
        env:
          CI: 'true'
        run: pnpm --filter gara-g-app-pwa test
name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  playwright-e2e:
    name: "🧪 Playwright E2E"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Antes este workflow tenia DOS claves `with:` seguidas (una de pnpm con
      # `version`, otra con `node-version`/`cache`). YAML silently descarta la
      # primera, asi que el runtime nunca recibia la configuracion de Node. Se
      # fusionaron en una sola clave `with:`.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      # El proyecto de Playwright vive en packages/app-pwa (antes apuntaba a
      # packages/app, que no existe en este repo).
      - name: Run E2E Tests
        run: cd packages/app-pwa && npx playwright test

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/app-pwa/playwright-report/
          retention-days: 30
name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-web:
    runs-on: ubuntu-latest
    name: Web Lint (Biome + ESLint)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: 'true'

      # `pnpm lint` es el wrapper del repo (scripts/lint-check.cjs), que ya
      # filtra a errores reales de lint y no a estilo/formato.
      # Antes este job hacia `pnpm biome check .` + `cd packages/app && pnpm lint`;
      # `packages/app` NO existe (la PWA vive en packages/app-pwa), asi que ese
      # paso era un fallo garantizado.
      - name: Lint (Biome)
        run: pnpm lint
        env:
          CI: 'true'

      - name: Type Check PWA
        # Ver nota en ci-swal-gara.yml: errores de tipo preexistentes, no bloqueante.
        run: |
          pnpm --filter gara-g-app-pwa check || echo "::warning::astro check reporta errores de tipo preexistentes (no bloqueante, ver REPORT.md)"
        env:
          CI: 'true'
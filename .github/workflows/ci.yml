name: CI

# Single consolidated workflow for the public repo. Replaces the old
# overlapping Lint / CI SWAL-GARA / e2e workflows (removed: they duplicated
# these jobs and ordered `pnpm/action-setup` AFTER `setup-node` with
# `cache: pnpm`, which fails with "Unable to locate executable file: pnpm").
# pnpm must be installed BEFORE setup-node whenever the pnpm cache is used.
# No deploy jobs here: deploys live in the private infra repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same version as the `packageManager` field in package.json.
  PNPM_VERSION: '10.34.7'

jobs:
  install:
    name: Install (lockfile in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `pnpm lint` is the repo wrapper (scripts/lint-check.cjs): it fails
      # only on real correctness/suspicious findings, not style/format.
      - name: Lint
        env:
          CI: 'true'
        run: pnpm lint

  typecheck:
    name: Typecheck (astro check, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Astro check
        # 57 pre-existing type errors in the app; the repo always treated
        # this as informational. Non-blocking on purpose, but the full log
        # stays visible so NEW errors are still seen (never silenced).
        run: |
          pnpm --filter gara-g-app-pwa check || echo "::warning::astro check reports pre-existing type errors (non-blocking; inspect the log above for new ones)"

  unit-tests:
    name: Unit tests (test:canon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run test:canon
        run: pnpm test:canon

  build:
    name: Build (build:canon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Public build: GARA_CLOUD is unset and there is no private/ overlay,
      # so the app builds local-first (cloud routes answer "cloud disabled").
      - name: Build canon
        run: pnpm build:canon
      - name: Deploy bundle safety tests (bundle content)
        # Skipped by the default `test` script; runs here after the build.
        # Without a build it fails instead of being skipped.
        working-directory: packages/app-pwa
        run: pnpm exec vitest run tests/deploy-bundle-safety.test.ts

  public-tree:
    name: Public tree has no infra ids or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.26.0/gitleaks_8.26.0_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # Real Cloudflare ids (by hash), demo credentials, key-file names and
      # gitleaks findings over every tracked file outside private/.
      - name: Check public tree
        run: bash scripts/check-public-tree.sh

  e2e:
    name: E2E (chromium, offline + guest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      # Local-first suite against a local dev server (never production):
      # the offline spec cuts all external network and the guest specs need
      # PUBLIC_DEMO=true plus the dev admin session, none of which exists
      # outside development. BASE_URL overrides the CI production default in
      # playwright.config.ts.
      - name: Start dev server
        working-directory: packages/app-pwa
        env:
          CLOUDFLARE_INCLUDE_PROCESS_ENV: 'true'
          ENVIRONMENT: 'development'
          DEV_ADMIN_SESSION: 'true'
          PUBLIC_DEMO: 'true'
        run: |
          (pnpm dev --host 0.0.0.0 --port 4321 > /tmp/astro-dev.log 2>&1 & echo $! > /tmp/astro-dev.pid)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4321/ > /dev/null 2>&1; then echo "dev server up"; break; fi
            if [ "$i" = 60 ]; then echo "::error::dev server did not start"; cat /tmp/astro-dev.log; exit 1; fi
            sleep 5
          done
      # offline-local-first is the offline suite (no external network, no cloud
      # module); guest-* cover the account-less journey. map-offline (CDN tiles +
      # LiveChart canvas pixels) and offline-queue (stale /fleets route) stay out:
      # pixel/GPU-sensitive and currently red even locally, see PR body.
      - name: Run Playwright (offline + guest, chromium)
        working-directory: packages/app-pwa
        env:
          BASE_URL: 'http://localhost:4321'
          CI: 'true'
        run: >
          pnpm exec playwright test --project=chromium
          tests/e2e/offline-local-first.spec.ts
          tests/e2e/guest-mode.spec.ts
          tests/e2e/guest-garage.spec.ts
          tests/e2e/guest-demo-chile.spec.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/app-pwa/playwright-report/
          retention-days: 7
      - name: Show dev server log
        if: failure()
        run: cat /tmp/astro-dev.log
